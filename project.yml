name: Transcribe
options:
  bundleIdPrefix: ai.w2solutions
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  # Seed the generated project's own Package.resolved from TranscribeKit's, so Xcode writes its Sparkle pin into the
  # (ignored) project and never into TranscribeKit/Package.resolved, which SwiftPM would change back.
  postGenCommand: mkdir -p Transcribe.xcodeproj/project.xcworkspace/xcshareddata/swiftpm && cp TranscribeKit/Package.resolved Transcribe.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  TranscribeKit:
    path: TranscribeKit
  # In-app updates for the Mac app only (TranscribeKit also builds for iOS). Pinned by revision, not tag: a tag can
  # move, and the revision also fixes the prebuilt framework and tools through the checksum in its Package.swift.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    revision: ab7d71291238df6e0492143b120c9b696a35f603  # 2.10.1. A bump changes this, the 2.10.1/2065 checks in release-mac.sh, Attributions and CLAUDE.md together.
targets:
  Transcribe:
    type: application
    platform: iOS
    sources:
      - Apps/iPhone/Sources
      - Apps/iPhone/Resources
      - Apps/Shared
      # The speech models (filled by scripts/fetch-models.sh, gitignored apart from its README). A folder
      # reference, so it is copied verbatim as Transcribe.app/BundledModels: never flattened or compiled.
      - path: BundledModels
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Check bundled models
        script: '"$SRCROOT/scripts/check-models.sh"'
        basedOnDependencyAnalysis: false
        showEnvVars: false
    dependencies:
      - package: TranscribeKit
        product: TranscribeCore
      - package: TranscribeKit
        product: TranscribeKit
      - package: TranscribeKit
        product: TranscribeDesign
      - package: TranscribeKit
        product: TranscribeFluid
      - package: TranscribeKit
        product: TranscribeFakes
      - package: TranscribeKit
        product: TranscribeCloudKit
    info:
      path: Apps/iPhone/Info.plist
      properties:
        CFBundleDisplayName: Transcribe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Transcribe records conversations on this iPhone and turns them into text on this iPhone."
        # remote-notification: CKSyncEngine fetches when iCloud pushes a change (only while sync is on).
        UIBackgroundModes: [audio, processing, remote-notification]
        # "NO" when built with TRANSCRIBE_SYNC=NO (no iCloud entitlement): the transport then never opens CloudKit.
        TranscribeICloud: $(TRANSCRIBE_SYNC)
        # Which CloudKit environment this build talks to; a change makes sync forget its state and join again.
        TranscribeICloudEnvironment: $(TRANSCRIBE_ICLOUD_ENV)
        # "YES" only in builds signed with the Background Inference entitlement: the speech-model prepare may then
        # use the Neural Engine in the background (Composition.appActivity; no runtime check exists on iOS).
        TranscribeBackgroundInference: $(TRANSCRIBE_BACKGROUND_INFERENCE)
        BGTaskSchedulerPermittedIdentifiers: ["ai.w2solutions.transcribe.process.*"]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.w2solutions.transcribe
        # TestFlight needs a build number higher than the last upload for this version.
        MARKETING_VERSION: "0.3.4"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # check-models.sh reads BundledModels, which the script sandbox would block. This target only;
        # the project-wide YES stays.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Simulator builds leave the ~700 MB of models out (they use the fake engine, or TRANSCRIBE_MODELS_DIR).
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=iphonesimulator*]": BundledModels
        # iCloud (CloudKit container iCloud.ai.w2solutions.transcribe) and push, for optional sync. Debug uses the
        # Development CloudKit environment; Release uses Production. To test against the Developer ID Mac, build with
        # TRANSCRIBE_ICLOUD_ENV=Production on the xcodebuild line (a development profile allows it).
        # aps-environment stays "development" in every configuration: builds and archives are signed with a
        # development profile, which only grants that value, and the App Store / Ad Hoc export sets "production" from
        # the distribution profile. It only picks the push gateway, not the CloudKit environment.
        # Signing with iCloud needs an explicit App ID with iCloud and Push, which Xcode registers when an Apple
        # account is signed in to it. Without one, TRANSCRIBE_SYNC=NO on the xcodebuild line signs with
        # Transcribe.local.entitlements (no iCloud, no push; sync then cannot start), which the wildcard team
        # profile covers.
        TRANSCRIBE_SYNC: "YES"
        TRANSCRIBE_ENTITLEMENTS_SUFFIX_NO: .local
        CODE_SIGN_ENTITLEMENTS: Apps/iPhone/Transcribe$(TRANSCRIBE_ENTITLEMENTS_SUFFIX_$(TRANSCRIBE_SYNC)).entitlements
        TRANSCRIBE_ICLOUD_ENV: Development
        TRANSCRIBE_APS_ENV: development
        # Background Inference (com.apple.developer.background-tasks.continued-processing.inference, iOS 27): Neural
        # Engine use in the background, which lets the speech-model prepare carry on after the user leaves the app.
        # Follows the entitlements file: Transcribe.entitlements carries the Background Inference key and
        # Transcribe.local.entitlements (TRANSCRIBE_SYNC=NO) never does. BackgroundInferenceConfigTests pins that pairing.
        TRANSCRIBE_BACKGROUND_INFERENCE: $(TRANSCRIBE_SYNC)
      configs:
        Release:
          TRANSCRIBE_ICLOUD_ENV: Production
  TranscribeMac:
    type: application
    platform: macOS
    sources:
      - Apps/Mac/Sources
      - Apps/Mac/Resources
      - Apps/Shared
      # The same speech models as the iPhone, copied verbatim into Transcribe.app/Contents/Resources/BundledModels
      # in every configuration (the sandboxed app cannot read TRANSCRIBE_MODELS_DIR).
      - path: BundledModels
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Check bundled models
        script: '"$SRCROOT/scripts/check-models.sh"'
        basedOnDependencyAnalysis: false
        showEnvVars: false
    dependencies:
      - package: TranscribeKit
        product: TranscribeCore
      - package: TranscribeKit
        product: TranscribeKit
      - package: TranscribeKit
        product: TranscribeDesign
      - package: TranscribeKit
        product: TranscribeFluid
      - package: TranscribeKit
        product: TranscribeFakes
      - package: TranscribeKit
        product: TranscribeCloudKit
      - package: TranscribeKit
        product: TranscribeMCP
      - package: TranscribeKit
        product: TranscribeMCPHost
      - package: Sparkle
      # The Claude helper (transcribe-mcp), signed on copy into Transcribe.app/Contents/Helpers.
      - target: TranscribeMCPHelper
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    # Sparkle's Downloader service is unused (the app has network.client and SUEnableDownloaderService is NO), so it is
    # removed from archived apps, leaving no unsandboxed fetcher in the bundle. release-mac.sh checks it is gone.
    # Xcode signed the framework on copy with the service inside, so the phase re-seals it exactly as Xcode signed it
    # (the app itself is signed after this phase; the Developer ID export re-signs everything again).
    postBuildScripts:
      - name: Remove Sparkle Downloader (archive only)
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          [ "$ACTION" = "install" ] || exit 0
          FW="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Frameworks/Sparkle.framework/Versions/B"
          rm -rf "$FW/XPCServices/Downloader.xpc"
          [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] || exit 0
          /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" $OTHER_CODE_SIGN_FLAGS -o runtime --preserve-metadata=identifier,entitlements,flags --generate-entitlement-der "$FW"
    info:
      path: Apps/Mac/Info.plist
      properties:
        CFBundleDisplayName: Transcribe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TranscribeICloudEnvironment: $(TRANSCRIBE_ICLOUD_ENV)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: "Transcribe records conversations and dictation on this Mac to turn them into text. Speech is processed on this Mac."
        # Mac audio (a Core Audio process tap, no entitlement): macOS shows this when Transcribe first records the
        # sound of calls and other apps. The Mac only; release-mac.sh checks it is there.
        NSAudioCaptureUsageDescription: "Transcribe records the sound of calls and other apps on this Mac when you choose Mac audio, to turn it into text. Speech is processed on this Mac."
        NSHumanReadableCopyright: "© 2026 W2 Solutions"
        ITSAppUsesNonExemptEncryption: false
        # Sparkle (in-app updates). The app turns the updater on only when it is not a Debug, fake-engine or UI-test
        # run and both values below are valid (UpdateAvailability). Sparkle asks once, on the second launch, whether
        # to check automatically (SUEnableAutomaticChecks is left out on purpose). No system profile, no automatic
        # install. Only a feed signed with this key is accepted, with no grace period for a bad signature.
        SUFeedURL: $(TRANSCRIBE_FEED_URL)
        SUPublicEDKey: $(TRANSCRIBE_ED_PUBLIC_KEY)
        SUEnableInstallerLauncherService: true
        SUEnableDownloaderService: false
        SURequireSignedFeed: true
        SUSignedFeedFailureExpirationInterval: 0
        SUVerifyUpdateBeforeExtraction: true
        SUAllowsAutomaticUpdates: false
        SUEnableSystemProfiling: false
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_NAME: Transcribe
        # The update end-to-end test overrides TRANSCRIBE_MAC_BUNDLE_ID on the xcodebuild line, which renames this
        # target alone (overriding PRODUCT_BUNDLE_IDENTIFIER there would rename the helper too).
        PRODUCT_BUNDLE_IDENTIFIER: $(TRANSCRIBE_MAC_BUNDLE_ID)
        TRANSCRIBE_MAC_BUNDLE_ID: ai.w2solutions.transcribe.mac
        MARKETING_VERSION: "0.3.4"
        # Debug builds stay "1"; release-mac.sh sets the real build number (major*10000 + minor*100 + patch).
        CURRENT_PROJECT_VERSION: "1"
        TRANSCRIBE_FEED_URL: https://w2solutions.ai/transcribe/appcast.xml
        # Public half of the Sparkle update key (generate_keys -p). Not secret. Empty: updates off, and release-mac.sh refuses a non-test release.
        TRANSCRIBE_ED_PUBLIC_KEY: "1Z/8MDXT937QvITrcGg8IsKL41bITaOcSiDGfBd2CQE="
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # check-models.sh reads BundledModels, which the script sandbox would block (as for the iPhone target).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_HARDENED_RUNTIME: YES
        # With a team (DEVELOPMENT_TEAM=53FBF5CS9U on the command line) the app is provisioned and gets iCloud and
        # push. Without one (make build-mac, make test-ui-mac) it is signed to run locally, where macOS refuses to
        # launch an app claiming iCloud, so it uses TranscribeMac.local.entitlements (sandbox and microphone only;
        # sync then reads as "not signed in"). TRANSCRIBE_ENTITLEMENTS_SUFFIX_ is the value for an empty team.
        TRANSCRIBE_ENTITLEMENTS_SUFFIX_: .local
        CODE_SIGN_ENTITLEMENTS: Apps/Mac/TranscribeMac$(TRANSCRIBE_ENTITLEMENTS_SUFFIX_$(DEVELOPMENT_TEAM)).entitlements
        OTHER_CODE_SIGN_FLAGS: --timestamp
        TRANSCRIBE_ICLOUD_ENV: Development
        TRANSCRIBE_APS_ENV: development
      configs:
        # Debug signs to run locally when no team is passed (make build-mac); with DEVELOPMENT_TEAM=53FBF5CS9U on
        # the command line Xcode signs with Apple Development instead. Release always needs the team.
        Debug:
          OTHER_CODE_SIGN_FLAGS: ""
          TRANSCRIBE_FEED_URL: ""
        # aps-environment stays "development" (as for the iPhone): the archive is signed with a development profile,
        # and the Developer ID export sets "production" from its profile (release-mac.sh checks the result).
        Release:
          TRANSCRIBE_ICLOUD_ENV: Production
  # transcribe-mcp, the stdio MCP server Claude Code and Claude Desktop run. Unsandboxed on purpose: it has no
  # entitlements file, so it carries none (release-mac.sh checks), and it reaches the app over loopback only.
  TranscribeMCPHelper:
    type: tool
    platform: macOS
    sources: [Apps/MacHelper/Sources]
    dependencies:
      - package: TranscribeKit
        product: TranscribeMCP
    settings:
      base:
        PRODUCT_NAME: transcribe-mcp
        PRODUCT_BUNDLE_IDENTIFIER: ai.w2solutions.transcribe.mac.mcp
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        # Signed with no entitlements at all, in every configuration. Without these, Xcode adds
        # com.apple.application-identifier, and get-task-allow in Debug.
        ENTITLEMENTS_REQUIRED: NO
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        OTHER_CODE_SIGN_FLAGS: --timestamp
      configs:
        # Signing to run locally (no team) leaves out the hardened runtime that ENABLE_HARDENED_RUNTIME asks for, so
        # Debug asks codesign for it directly; code-sign-on-copy into the app keeps the flag.
        Debug:
          OTHER_CODE_SIGN_FLAGS: --options=runtime
  TranscribeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests/Shared
      - UITests/iPhone
      - Apps/Shared/AccessibilityID.swift
    dependencies:
      - target: Transcribe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.w2solutions.transcribe.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Transcribe
  TranscribeMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests/Shared
      - UITests/Mac
      - Apps/Shared/AccessibilityID.swift
    dependencies:
      - target: TranscribeMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.w2solutions.transcribe.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TranscribeMac
schemes:
  Transcribe:
    build:
      targets:
        Transcribe: all
        TranscribeUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-useFakeEngine": false
        "-uiTesting": false
      environmentVariables:
        # DEBUG only: the real engine in the simulator loads the fetched models from the Mac.
        TRANSCRIBE_MODELS_DIR: $(SRCROOT)/BundledModels
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TranscribeUITests
  TranscribeMac:
    build:
      targets:
        TranscribeMac: all
        TranscribeMacUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-useFakeEngine": false
        "-uiTesting": false
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TranscribeMacUITests
    archive:
      config: Release
