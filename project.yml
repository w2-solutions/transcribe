name: Transcribe
options:
  bundleIdPrefix: ai.w2solutions
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  TranscribeKit:
    path: TranscribeKit
targets:
  Transcribe:
    type: application
    platform: iOS
    sources:
      - Apps/iPhone/Sources
      - Apps/iPhone/Resources
      - Apps/Shared
      # The speech models (filled by scripts/fetch-models.sh, gitignored apart from its README). A folder
      # reference, so it is copied verbatim as Transcribe.app/BundledModels: never flattened or compiled.
      - path: BundledModels
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Check bundled models
        script: '"$SRCROOT/scripts/check-models.sh"'
        basedOnDependencyAnalysis: false
        showEnvVars: false
    dependencies:
      - package: TranscribeKit
        product: TranscribeCore
      - package: TranscribeKit
        product: TranscribeKit
      - package: TranscribeKit
        product: TranscribeDesign
      - package: TranscribeKit
        product: TranscribeFluid
      - package: TranscribeKit
        product: TranscribeFakes
    info:
      path: Apps/iPhone/Info.plist
      properties:
        CFBundleDisplayName: Transcribe
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Transcribe records conversations on this iPhone to turn them into text. Audio never leaves the device."
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers: ["ai.w2solutions.transcribe.process.*"]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.w2solutions.transcribe
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # check-models.sh reads BundledModels, which the script sandbox would block. This target only;
        # the project-wide YES stays.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Simulator builds leave the ~700 MB of models out (they use the fake engine, or TRANSCRIBE_MODELS_DIR).
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=iphonesimulator*]": BundledModels
  TranscribeMac:
    type: application
    platform: macOS
    sources:
      - Apps/Mac/Sources
      - Apps/Mac/Resources
      - Apps/Shared
      # The same speech models as the iPhone, copied verbatim into Transcribe.app/Contents/Resources/BundledModels
      # in every configuration (the sandboxed app cannot read TRANSCRIBE_MODELS_DIR).
      - path: BundledModels
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Check bundled models
        script: '"$SRCROOT/scripts/check-models.sh"'
        basedOnDependencyAnalysis: false
        showEnvVars: false
    dependencies:
      - package: TranscribeKit
        product: TranscribeCore
      - package: TranscribeKit
        product: TranscribeKit
      - package: TranscribeKit
        product: TranscribeDesign
      - package: TranscribeKit
        product: TranscribeFluid
      - package: TranscribeKit
        product: TranscribeFakes
    info:
      path: Apps/Mac/Info.plist
      properties:
        CFBundleDisplayName: Transcribe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: "Transcribe records conversations on this Mac to turn them into text. Speech is processed on this Mac."
        NSHumanReadableCopyright: "© 2026 W2 Solutions"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Transcribe
        PRODUCT_BUNDLE_IDENTIFIER: ai.w2solutions.transcribe.mac
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # check-models.sh reads BundledModels, which the script sandbox would block (as for the iPhone target).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Apps/Mac/TranscribeMac.entitlements
        OTHER_CODE_SIGN_FLAGS: --timestamp
      configs:
        # Debug signs to run locally when no team is passed (make build-mac); with DEVELOPMENT_TEAM=53FBF5CS9U on
        # the command line Xcode signs with Apple Development instead. Release always needs the team.
        Debug:
          OTHER_CODE_SIGN_FLAGS: ""
  TranscribeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests/Shared
      - UITests/iPhone
      - Apps/Shared/AccessibilityID.swift
    dependencies:
      - target: Transcribe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.w2solutions.transcribe.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Transcribe
  TranscribeMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests/Shared
      - UITests/Mac
      - Apps/Shared/AccessibilityID.swift
    dependencies:
      - target: TranscribeMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.w2solutions.transcribe.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TranscribeMac
schemes:
  Transcribe:
    build:
      targets:
        Transcribe: all
        TranscribeUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-useFakeEngine": false
        "-uiTesting": false
      environmentVariables:
        # DEBUG only: the real engine in the simulator loads the fetched models from the Mac.
        TRANSCRIBE_MODELS_DIR: $(SRCROOT)/BundledModels
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TranscribeUITests
  TranscribeMac:
    build:
      targets:
        TranscribeMac: all
        TranscribeMacUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-useFakeEngine": false
        "-uiTesting": false
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TranscribeMacUITests
    archive:
      config: Release
